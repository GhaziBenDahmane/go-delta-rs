syntax = "proto3";

package delta;

option go_package = "github.com/ghazibendahmane/go-delta-rs/gen/go/delta";

service DeltaService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc CreateTable(CreateTableRequest) returns (CreateTableResponse);
  rpc Write(WriteRequest) returns (WriteResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc GetTableInfo(GetTableInfoRequest) returns (GetTableInfoResponse);
  rpc History(HistoryRequest) returns (HistoryResponse);
  rpc Vacuum(VacuumRequest) returns (VacuumResponse);
  rpc Optimize(OptimizeRequest) returns (OptimizeResponse);
  rpc RewriteCheckpointMultipart(RewriteCheckpointMultipartRequest) returns (RewriteCheckpointMultipartResponse);
  rpc CheckStorageCapabilities(StorageCapabilitiesRequest) returns (StorageCapabilitiesResponse);
  rpc RuntimeStats(RuntimeStatsRequest) returns (RuntimeStatsResponse);
  rpc ClearTableCache(ClearTableCacheRequest) returns (ClearTableCacheResponse);
  rpc ReleaseMemory(ReleaseMemoryRequest) returns (ReleaseMemoryResponse);
}

// ---------- Health ----------

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string version = 2;
}

// ---------- Schema ----------

message ColumnDef {
  string name = 1;
  // Supported: string, int32, int64, float32, float64, boolean, timestamp, date
  string data_type = 2;
  bool nullable = 3;
}

// ---------- CreateTable ----------

message CreateTableRequest {
  string table_uri = 1;
  repeated ColumnDef schema = 2;
  repeated string partition_columns = 3;
}

message CreateTableResponse {
  bool created = 1;
  string message = 2;
}

// ---------- Write ----------

message WriteRequest {
  string table_uri = 1;
  // "append" or "overwrite"
  string mode = 2;
  // JSON array of row objects, e.g. [{"id":1,"name":"alice"},...]
  string json_data = 3;
  // Optional: column definitions needed when writing to a new table.
  // If omitted the schema is inferred from json_data (all strings).
  repeated ColumnDef schema = 4;
  // Optional stable identifier for diagnostics and commit metadata.
  string batch_id = 5;
  // Optional Delta application transaction id. When present with a positive
  // app_transaction_version, repeated writes with the same transaction are
  // treated as already committed.
  string app_transaction_id = 6;
  int64 app_transaction_version = 7;
  // Create the Delta table before writing when it does not exist. This is
  // especially useful for first append writes that must preserve partition
  // metadata.
  bool create_if_missing = 8;
  repeated string partition_columns = 9;
}

message WriteResponse {
  int64 version = 1;
  int64 rows_written = 2;
  bool already_committed = 3;
  string batch_id = 4;
}

// ---------- Delete ----------

message DeleteRequest {
  string table_uri = 1;
  // SQL predicate parsed by delta-rs/DataFusion, e.g. "event_date < '2026-01-01'".
  // Empty means full-table delete and requires allow_full_table_delete=true.
  string predicate = 2;
  bool allow_full_table_delete = 3;
}

message DeleteResponse {
  int64 version = 1;
  int64 files_added = 2;
  int64 files_removed = 3;
  int64 rows_deleted = 4;
  int64 rows_copied = 5;
  int64 execution_time_ms = 6;
  int64 scan_time_ms = 7;
  int64 rewrite_time_ms = 8;
}

// ---------- Read ----------

message ReadRequest {
  string table_uri = 1;
  // Optional: read a specific version. Empty = latest.
  string version = 2;
  // Optional: SQL WHERE clause applied via DataFusion, e.g. "id > 5"
  string filter = 3;
  // 0 = no limit
  int64 limit = 4;
}

message ReadResponse {
  // JSON array of row objects
  string json_data = 1;
  int64 num_rows = 2;
}

// ---------- GetTableInfo ----------

message GetTableInfoRequest {
  string table_uri = 1;
}

message GetTableInfoResponse {
  int64 version = 1;
  repeated ColumnDef schema = 2;
  repeated string partition_columns = 3;
  int64 num_files = 4;
  string created_time = 5;
}

// ---------- History ----------

message HistoryRequest {
  string table_uri = 1;
  // 0 = all history
  int32 limit = 2;
}

message CommitInfo {
  int64 version = 1;
  string timestamp = 2;
  string operation = 3;
  string operation_parameters = 4;
}

message HistoryResponse {
  repeated CommitInfo commits = 1;
}

// ---------- Optimize ----------

message OptimizeRequest {
  string table_uri = 1;
  // Target file size in bytes. 0 = use default (256 MiB).
  int64 target_size_bytes = 2;
  // Optional equality partition filter in "key=value" format,
  // e.g. "year_month=2026-02". Only files in the matching partition
  // are compacted. Leave empty to optimize all partitions.
  string partition_filter = 3;
  // Optional Z-ORDER columns. When set, OPTIMIZE applies Z-ordering
  // on the specified columns to co-locate related data within files,
  // improving query performance for filters on those columns.
  repeated string z_order_columns = 4;
}

message OptimizeResponse {
  int64 files_added = 1;
  int64 files_removed = 2;
  int64 partitions_optimized = 3;
}

// ---------- Checkpoint Maintenance ----------

message RewriteCheckpointMultipartRequest {
  string table_uri = 1;
  // Desired maximum checkpoint part size in bytes. 0 uses the server default.
  int64 target_part_size_bytes = 2;
  // Explicit number of checkpoint parts. When >0 this takes precedence over
  // target_part_size_bytes.
  int32 target_parts = 3;
  // Preview the rewrite plan without writing objects.
  bool dry_run = 4;
}

message RewriteCheckpointMultipartResponse {
  int64 version = 1;
  int32 source_parts = 2;
  int32 target_parts = 3;
  int64 source_size_bytes = 4;
  int64 target_size_bytes = 5;
  int64 max_part_size_bytes = 6;
  int64 rows = 7;
  bool rewritten = 8;
  string backup_prefix = 9;
  repeated string checkpoint_files = 10;
  string message = 11;
}

// ---------- Storage Capability Probe ----------

message StorageCapabilitiesRequest {
  string table_uri = 1;
}

message CapabilityCheck {
  string name = 1;
  bool supported = 2;
  string error = 3;
}

message StorageCapabilitiesResponse {
  string table_uri = 1;
  repeated CapabilityCheck checks = 2;
}

// ---------- Runtime / Memory ----------

message MemoryStats {
  uint64 allocated_bytes = 1;
  uint64 active_bytes = 2;
  uint64 resident_bytes = 3;
  uint64 mapped_bytes = 4;
  uint64 retained_bytes = 5;
}

message RuntimeStatsRequest {}

message RuntimeStatsResponse {
  MemoryStats memory = 1;
  int64 table_cache_entries = 2;
  int64 table_cache_max_entries = 3;
  int64 table_cache_ttl_seconds = 4;
}

message ClearTableCacheRequest {
  // Empty clears every cached table.
  string table_uri = 1;
  bool release_memory = 2;
}

message ClearTableCacheResponse {
  int64 tables_removed = 1;
  int64 table_cache_entries = 2;
  MemoryStats memory_before = 3;
  MemoryStats memory_after = 4;
}

message ReleaseMemoryRequest {}

message ReleaseMemoryResponse {
  MemoryStats memory_before = 1;
  MemoryStats memory_after = 2;
}

// ---------- Vacuum ----------

message VacuumRequest {
  string table_uri = 1;
  // Hours of data to retain. Default (0) uses Delta default (168h / 7 days).
  float retention_hours = 2;
  bool dry_run = 3;
}

message VacuumResponse {
  repeated string deleted_files = 1;
  int64 num_deleted = 2;
}
